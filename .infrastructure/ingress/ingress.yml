apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: todoapp-ingress
  namespace: todoapp
spec:
  rules:
  - http:
      paths:
      - ImplementationSpecific: Prefix
        path: /(/.*)?
        backend:
          service:
            name: todoapp-service
            port:
              number: 8080

